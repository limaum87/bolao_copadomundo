version: "3.9"

services:
  backend:
    image: bolao-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5026:5000"
    environment:
      - FLASK_APP=backend.app
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/backend/data.db
      - TZ=America/Sao_Paulo
      # Web Push (VAPID) — gere com: docker compose exec backend python -m backend.generate_vapid
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@bolao.local}
      # Lembretes de palpite: janela (min) e intervalo do scheduler (s)
      - BOLAO_REMINDER_WINDOW_MIN=${BOLAO_REMINDER_WINDOW_MIN:-120}
      - BOLAO_NOTIFY_INTERVAL=${BOLAO_NOTIFY_INTERVAL:-300}
      # Lembrete diário: a partir de qual hora (0-23) avisar palpites faltantes do dia.
      # Usado apenas como valor inicial na criação do banco; depois disso é
      # controlado pela tela de Configurações do admin (banco de dados).
      - BOLAO_DAILY_REMINDER_HOUR=${BOLAO_DAILY_REMINDER_HOUR:-11}
      # Ranking ao vivo: intervalo (s) do poller que atualiza o placar parcial
      # durante os jogos. Default 30s. Só bate na ESPN quando há jogo em andamento.
      - BOLAO_LIVE_INTERVAL=${BOLAO_LIVE_INTERVAL:-30}
    volumes:
      - ./backend:/app/backend
      - ./jogos_copa_2026.json:/app/jogos_copa_2026.json:ro
    restart: unless-stopped

  frontend:
    image: bolao-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "2626:80"

    volumes:
      - ./frontend:/var/www/html
    depends_on:
      - backend
    restart: unless-stopped
