version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=backend.app
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/backend/data.db
    volumes:
      - ./backend:/app/backend
      - ./jogos_copa_2026.txt:/app/jogos_copa_2026.txt:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    environment:
      - API_BASE=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
