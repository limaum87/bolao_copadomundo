<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Bolão Copa 2026</title>
    <meta name="theme-color" content="#009739">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #009739 0%, #006831 100%);
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .icon {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.75rem;
            font-weight: 800;
        }
        p {
            opacity: 0.92;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }
        button {
            background: #FEDD00;
            color: #006831;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.9rem 2rem;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); }
        button:active { transform: translateY(0); }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Você está offline</h1>
        <p>Não conseguimos conectar agora. Verifique sua internet e tente novamente.</p>
        <button onclick="location.reload()">🔄 Tentar novamente</button>
    </div>
    <script>
        // Recarrega automaticamente quando a conexão voltar
        window.addEventListener('online', () => location.reload());
    </script>
</body>

</html>
